<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Envelopes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Envelopes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F5F3EF; --card: #FFFFFF; --line: #E6E2DA; --track: #ECE8E1;
  --fg: #171717; --muted: #5F5E5A; --accent: #2F5D50; --accent-soft: #E9F0ED;
  --warn: #B54708; --key: #FFFFFF; --primary: #171717; --on-primary: #FFFFFF;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151614; --card: #1E201D; --line: #30332D; --track: #2C2F29;
    --fg: #F2F1EC; --muted: #AAA8A0; --accent: #7FB8A4; --accent-soft: #24352F;
    --warn: #F0A060; --key: #22241F; --primary: #F2F1EC; --on-primary: #151614;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 520px; margin: 0 auto; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 20px; }

/* Sign in */
.signin { max-width: 400px; margin: 0 auto; padding-block: 12vh 40px; display: flex; flex-direction: column; gap: 16px; }
.signin h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; }
.signin p { margin: 0; color: var(--muted); line-height: 1.5; }
.error { color: var(--warn); font-size: 14px; font-weight: 500; min-height: 20px; }

.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weekbar .label { display: flex; flex-direction: column; align-items: center; text-align: center; }
.weekbar .label strong { font-size: 15px; font-weight: 600; }
.weekbar .label span { font-size: 13px; color: var(--muted); }
.navbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; }
.navbtn:disabled { opacity: .35; cursor: default; }

.summary { display: flex; flex-direction: column; gap: 6px; }
.summary .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.summary .big b { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.summary .big span { font-size: 17px; font-weight: 600; color: var(--muted); }
.summary .big b.over { color: var(--warn); }
.summary p { margin: 0; font-size: 14px; color: var(--muted); }

.bar { display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.bar.warn > span { background: var(--warn); }
.bar.thick { height: 8px; margin-top: 8px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-align: left; cursor: pointer; min-width: 0; }
.card.wide { grid-column: span 2; }
.card:active { transform: scale(.985); }
.card .head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.icon { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.names { display: flex; flex-direction: column; min-width: 0; }
.names b { font-size: 15px; font-weight: 600; }
.names span { font-size: 12px; color: var(--muted); }
.amt { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.amt b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.amt b.over { color: var(--warn); }
.amt span { font-size: 12px; color: var(--muted); }
.last { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { grid-column: span 2; padding: 28px 18px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); line-height: 1.5; }

.section-title { margin: 4px 0 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.entries { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.entry { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 14px; border-top: 1px solid var(--line); }
.entry:first-child { border-top: none; }
.entry .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.entry .main b { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .main span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delbtn { min-width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0 6px; }
.delbtn.confirm { color: var(--warn); font-size: 13px; font-weight: 600; }
.entries .none { padding: 18px 14px; color: var(--muted); font-size: 14px; }

.foot { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.linkbtn { border: none; background: transparent; color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 8px; cursor: pointer; }

/* Add-spending sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; justify-content: center; overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-inner { width: 100%; max-width: 480px; min-height: 100%; display: flex; flex-direction: column; gap: 14px; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; }
.textbtn { height: 44px; min-width: 72px; padding: 0 4px; border: none; background: transparent; font-size: 17px; font-weight: 500; color: var(--accent); text-align: left; cursor: pointer; }
.sheet-title { display: flex; flex-direction: column; align-items: center; }
.sheet-title b { font-size: 17px; font-weight: 600; }
.sheet-title span { font-size: 12px; color: var(--muted); }
.spacer { min-width: 72px; }
.display { flex: 1; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.display .ctx { font-size: 14px; color: var(--muted); }
.display .num { display: flex; align-items: baseline; gap: 8px; }
.display .num b { font-size: clamp(48px, 16vw, 68px); font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.display .num b.placeholder { color: var(--muted); opacity: .6; }
.display .num span { font-size: 20px; font-weight: 600; color: var(--muted); }
.display .after { font-size: 14px; color: var(--muted); min-height: 18px; }
.display .after.over { color: var(--warn); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg); font: inherit; font-size: 16px; width: 100%; }
.suggest { display: flex; flex-direction: column; gap: 6px; }
.suggest-hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
.suggest-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin-inline: -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: flex; align-items: center; flex-shrink: 0; max-width: 260px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); overflow: hidden; }
.chip.selected { border-color: var(--accent); background: var(--accent-soft); }
.chip-text { border: none; background: transparent; height: 40px; padding: 0 2px 0 14px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 216px; cursor: pointer; }
.chip-pin { border: none; background: transparent; width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); cursor: pointer; flex-shrink: 0; }
.chip-pin.on { color: var(--accent); }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.key { height: 56px; border: 1px solid var(--line); border-radius: 14px; background: var(--key); font-size: 26px; font-weight: 500; display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; }
.key:active { background: var(--track); }
.primary { height: 56px; border: none; border-radius: 16px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600; cursor: pointer; width: 100%; }
.primary:disabled { opacity: .35; cursor: default; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 50;
  max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 14px; background: var(--primary); color: var(--on-primary);
  font-size: 14px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
@media (prefers-reduced-motion: reduce) { .card:active { transform: none; } }

/* Chat-style main screen */
:root { --warn-soft: #FCEEE2; --mine: #E3EDE9; }
@media (prefers-color-scheme: dark) { :root { --warn-soft: #3A2A1C; --mine: #24352F; } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
body.chatting::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.chat-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.chat-head-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.chat-sum { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chat-sum b { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.chat-sum b.over { color: var(--warn); }
.chat-sum span { font-size: 14px; font-weight: 600; color: var(--muted); }
.pillbtn { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer; }
.msgs { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; padding-top: 12px; padding-bottom: var(--composer-h, 120px); }
.day { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 0 2px; }
.day-total { color: var(--fg); font-variant-numeric: tabular-nums; }
.update { position: fixed; left: 0; right: 0; top: 0; z-index: 45; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 500; }
.update button { height: 36px; padding: 0 16px; border-radius: 10px; border: none; background: var(--on-primary); color: var(--primary); font-weight: 600; cursor: pointer; }
.bwrap { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.bwrap.mine { align-items: flex-end; }
.bub { max-width: 82%; padding: 8px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer; }
.bwrap.mine .bub { background: var(--mine); border-color: transparent; }
.bub .t { font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.bub .t b { font-variant-numeric: tabular-nums; }
.bub .m { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
.tag.un { background: var(--warn-soft); color: var(--warn); }
.tag.so { background: var(--bg); color: var(--accent); }
.bub { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; transition: transform .12s ease; }
.bub.pressing { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) { .bub, .bub.pressing { transition: none; transform: none; } }
.menu-back { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .38); display: flex; align-items: flex-end; justify-content: center; }
.menu { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.menu-head { display: flex; flex-direction: column; gap: 2px; padding-inline: 4px; }
.menu-head b { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.menu-head span { font-size: 13px; color: var(--muted); }
.menu-list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.menu-list button { min-height: 50px; padding: 0 16px; border: none; border-top: 1px solid var(--line); background: transparent; font-size: 16px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.menu-list button:first-child { border-top: none; }
.menu-list button .sub { font-size: 13px; color: var(--muted); }
.menu-list button.on { color: var(--accent); font-weight: 600; }
.menu-list .danger { color: var(--warn); }
.menu-form { display: flex; flex-direction: column; gap: 12px; }
.menu-cancel { height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 16px; font-weight: 600; color: var(--accent); cursor: pointer; }
.chat-empty { margin: 32px auto 0; max-width: 300px; text-align: center; color: var(--muted); line-height: 1.5; font-size: 14px; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bg); border-top: 1px solid var(--line);
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.comp-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.comp-row { display: flex; align-items: center; gap: 8px; }
.modebtn, .sendbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; cursor: pointer; }
.modebtn { border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.sendbtn { border: none; background: var(--primary); color: var(--on-primary); }
.sendbtn:disabled { opacity: .35; cursor: default; }
.cfield { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 12px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
.cfield:focus-within { border-color: var(--accent); }
.cfield input { flex: 1; min-width: 0; height: 42px; border: none; background: transparent; color: var(--fg); font: inherit; font-size: 16px; outline: none; }
.expr { flex-shrink: 0; max-width: 55%; height: 32px; padding: 0 10px; border: none; border-radius: 16px; background: var(--accent-soft); color: var(--fg); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.preview { font-size: 12px; color: var(--muted); padding-inline: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview.bad { color: var(--warn); }
.pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pad button { height: 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--key); font-size: 22px; font-weight: 500; display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; }
.pad button.op { background: var(--accent-soft); color: var(--accent); font-size: 24px; }
.pad button.small { font-size: 15px; font-weight: 600; }
.pad button:active { background: var(--track); }
</style>
</head>
<body>

<!-- Sign in -->
<form class="signin" id="signin" hidden novalidate>
  <h1>Family Envelopes</h1>
  <p>Sign in with the email and password set up for you.</p>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" inputmode="email" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="primary" id="signin-btn" type="submit">Sign in</button>
  <div class="error" id="signin-error" role="alert"></div>
</form>

<!-- Setup or access message -->
<div class="signin" id="notice" hidden>
  <h1>Family Envelopes</h1>
  <p id="notice-text"></p>
  <button class="primary" id="notice-signout" type="button" hidden>Sign out</button>
</div>

<!-- Main: chat-style log -->
<div id="chat" hidden>
  <header class="chat-head">
    <div class="chat-head-inner">
      <div class="weekbar">
        <button class="navbtn" id="chat-prev" type="button" aria-label="Previous week">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="label"><strong id="chat-week-name">This week</strong><span id="chat-week-range"></span></div>
        <button class="navbtn" id="chat-next" type="button" aria-label="Next week" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="chat-sum">
        <div><b id="chat-left">0</b> <span>EGP left</span></div>
        <button class="pillbtn" id="to-envelopes" type="button">Envelopes</button>
      </div>
      <div class="bar" id="chat-bar"><span style="width:0%"></span></div>
    </div>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"></div>

  <div class="composer" id="composer">
    <div class="comp-inner">
      <div class="preview" id="preview" hidden></div>
      <div class="comp-row">
        <button class="modebtn" id="modebtn" type="button" aria-label="Show number pad"></button>
        <div class="cfield">
          <button class="expr" id="expr" type="button" hidden aria-label="Edit amount on number pad"></button>
          <label for="entry" class="sr-only">What did you spend?</label>
          <input id="entry" type="text" maxlength="160" autocomplete="off" enterkeyhint="send" placeholder="150 club entry">
        </div>
        <button class="sendbtn" id="sendbtn" type="button" aria-label="Save entry"></button>
      </div>
      <div class="pad" id="pad" hidden>
        <button type="button" data-p="7">7</button><button type="button" data-p="8">8</button><button type="button" data-p="9">9</button><button type="button" data-p="del" class="op" aria-label="Delete"></button>
        <button type="button" data-p="4">4</button><button type="button" data-p="5">5</button><button type="button" data-p="6">6</button><button type="button" data-p="-" class="op" aria-label="Minus">−</button>
        <button type="button" data-p="1">1</button><button type="button" data-p="2">2</button><button type="button" data-p="3">3</button><button type="button" data-p="+" class="op" aria-label="Plus">+</button>
        <button type="button" data-p="." aria-label="Decimal point">.</button><button type="button" data-p="0">0</button><button type="button" data-p="00">00</button><button type="button" data-p="abc" class="op small" aria-label="Type a note">abc</button>
      </div>
    </div>
  </div>
</div>

<!-- Press-and-hold menu for an entry -->
<div class="menu-back" id="menu" hidden>
  <div class="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="menu-head"><b id="menu-title"></b><span id="menu-sub"></span></div>
    <div class="menu-list" id="menu-main">
      <button type="button" data-a="edit">Edit amount and note</button>
      <button type="button" data-a="env">Change envelope <span class="sub" id="menu-env-now"></span></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var ICON = {
    food: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7.5c0-1 1-1.5 1-2.5M12 7.5c0-1 1-1.5 1-2.5M16 7.5c0-1 1-1.5 1-2.5"/>',
    kids: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>',
    fun: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
    car: '<path d="M4 16l1.5-5.2A2 2 0 0 1 7.4 9.3h9.2a2 2 0 0 1 1.9 1.5L20 16v2H4z"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/>',
    health: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/>',
    home: '<path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/>',
    bills: '<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
    emergency: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',
    unknown: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17h.01"/>',
    calc: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/>',
    keyboard: '<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M6.5 14h.01M17.5 14h.01M9.5 14h5"/>',
    send: '<path d="M12 19V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/>',
    back: '<path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
    pin: '<path d="M9 3.5h6l-1 5.5 3 3V14H7v-2l3-3z"/><path d="M12 14v6.5"/>',
    dot: '<circle cx="12" cy="12" r="4"/>',
    trash: '<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>'
  };
  var WIDE = { food: true };
  var WEEK_STARTS_ON = 6; // Saturday
  var APP_VERSION = '4.4'; // keep in step with version.json

  var $ = function (id) { return document.getElementById(id); };
  var sb = null;
  var myId = null, members = {}, envList = [], expenses = [];
  var loadedFor = null, weekOffset = 0, weekLoaded = false, weekReq = 0, channel = null;
  var sel = null, amount = '', saving = false, returnFocus = null;
  var pendingDelete = null, pendingTimer = null, toastTimer = null;
  var notePins = [], noteRecent = [], notesReq = 0, pinBusy = false;
  var expr = '', padOpen = false, sending = false, scrollToEnd = false;

  /* ---------- helpers ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function icon(name, size) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    [['width', size || 18], ['height', size || 18], ['viewBox', '0 0 24 24'], ['fill', 'none'], ['stroke', 'currentColor'],
     ['stroke-width', '1.8'], ['stroke-linecap', 'round'], ['stroke-linejoin', 'round'], ['aria-hidden', 'true']]
      .forEach(function (a) { s.setAttribute(a[0], a[1]); });
    s.innerHTML = Object.prototype.hasOwnProperty.call(ICON, name) ? ICON[name] : ICON.dot;
    return s;
  }
  function fmt(n) { return (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function signed(n) { return (n < 0 ? '−' : '') + fmt(Math.abs(n)); }
  function startOfWeek(offset) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() - WEEK_STARTS_ON + 7) % 7) + offset * 7);
    return d;
  }
  function dayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function rangeLabel(start) {
    var end = new Date(start);
    end.setDate(end.getDate() + 6);
    var a = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var b = end.getMonth() === start.getMonth() ? String(end.getDate()) : end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return a + ' – ' + b;
  }
  function envById(id) {
    for (var i = 0; i < envList.length; i++) if (envList[i].id === id) return envList[i];
    return null;
  }
  function spentFor(id) {
    var s = 0;
    expenses.forEach(function (x) { if (x.envelope_id === id) s += Number(x.amount) || 0; });
    return s;
  }
  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function showView(name) {
    $('signin').hidden = name !== 'signin';
    $('notice').hidden = name !== 'notice';
    $('main').hidden = name !== 'main';
    $('chat').hidden = name !== 'chat';
    document.body.classList.toggle('chatting', name === 'chat');
    if (name === 'chat') { scrollToEnd = true; renderChat(); }
    else { window.scrollTo(0, 0); }
  }
  function notice(text, withSignout) {
    $('notice-text').textContent = text;
    $('notice-signout').hidden = !withSignout;
    showView('notice');
  }

  /* ---------- rendering ---------- */
  function render() {
    var start = startOfWeek(weekOffset);
    $('week-name').textContent = weekOffset === 0 ? 'This week' : (weekOffset === -1 ? 'Last week' : 'Week of ' + start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
    var range = rangeLabel(start);
    if (weekOffset === 0) {
      var dayNum = Math.round((new Date().setHours(0, 0, 0, 0) - start.getTime()) / 86400000) + 1;
      range += ' · Day ' + Math.min(7, Math.max(1, dayNum)) + ' of 7';
    }
    $('week-range').textContent = range;
    $('next-week').disabled = weekOffset >= 0;
    $('entries-title').textContent = weekOffset === 0 ? 'Spending this week' : 'Spending that week';
    $('chat-week-name').textContent = $('week-name').textContent;
    $('chat-week-range').textContent = range;
    $('chat-next').disabled = weekOffset >= 0;
    renderGrid();
    renderEntries();
    renderChat();
  }

  /* ---------- chat view ---------- */
  function dayLabel(d) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var that = new Date(d); that.setHours(0, 0, 0, 0);
    var diff = Math.round((today - that) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function renderChat() {
    if ($('chat').hidden) return;
    var totalBudget = 0, totalSpent = 0;
    envList.forEach(function (e) { totalBudget += Number(e.weekly) || 0; });
    expenses.forEach(function (x) { totalSpent += Number(x.amount) || 0; });
    var left = totalBudget - totalSpent;
    var cl = $('chat-left');
    cl.textContent = weekLoaded ? signed(left) : '…';
    cl.className = left < 0 ? 'over' : '';
    var cb = $('chat-bar');
    cb.className = 'bar' + (totalBudget > 0 && left < totalBudget * 0.2 ? ' warn' : '');
    cb.firstElementChild.style.width = (totalBudget > 0 ? Math.min(100, Math.max(0, totalSpent / totalBudget * 100)) : 0).toFixed(1) + '%';

    var box = $('msgs');
    box.textContent = '';
    if (!weekLoaded) { box.appendChild(el('p', 'chat-empty', 'Loading…')); return; }
    if (!expenses.length) {
      box.appendChild(el('p', 'chat-empty', weekOffset === 0
        ? 'Type what you spent, like “150 club entry”, and send it. Use the number pad to add things up. Claude sorts entries into envelopes later.'
        : 'Nothing was added that week.'));
      return;
    }
    var dayTotals = {};
    expenses.forEach(function (x) {
      var d = new Date(x.spent_at);
      if (!isNaN(d)) { var k = dayKey(d); dayTotals[k] = (dayTotals[k] || 0) + (Number(x.amount) || 0); }
    });
    var lastDay = null;
    expenses.slice().reverse().forEach(function (x) {
      var d = new Date(x.spent_at);
      var dk = isNaN(d) ? '' : dayKey(d);
      if (dk && dk !== lastDay) {
        var head = el('div', 'day');
        head.appendChild(document.createTextNode(dayLabel(d) + ' · '));
        head.appendChild(el('span', 'day-total', fmt(dayTotals[dk]) + ' EGP'));
        box.appendChild(head);
        lastDay = dk;
      }
      var mine = x.spent_by === myId;
      var wrap = el('div', 'bwrap' + (mine ? ' mine' : ''));
      var b = el('button', 'bub');
      b.type = 'button';
      var env = envById(x.envelope_id);
      var unsorted = x.envelope_id === 'unknown' || !env;
      var who = mine ? 'You' : (members[x.spent_by] || 'Someone');
      var time = isNaN(d) ? '' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      b.setAttribute('aria-label', fmt(x.amount) + ' EGP' + (x.note ? ', ' + x.note : '') + ', ' + (unsorted ? 'unsorted' : env.name) + ', ' + who + (time ? ' at ' + time : '') + '. Press and hold for options');
      var t = el('span', 't');
      t.appendChild(el('b', null, fmt(x.amount)));
      if (x.note) t.appendChild(document.createTextNode(' · ' + x.note));
      b.appendChild(t);
      var m = el('span', 'm');
      m.appendChild(el('span', 'tag ' + (unsorted ? 'un' : 'so'), unsorted ? 'Unsorted' : String(env.name)));
      m.appendChild(el('span', null, (mine ? '' : who + ' · ') + time));
      b.appendChild(m);
      attachHold(b, x);
      wrap.appendChild(b);
      box.appendChild(wrap);
    });
    if (scrollToEnd) {
      scrollToEnd = false;
      requestAnimationFrame(function () { window.scrollTo(0, document.documentElement.scrollHeight); });
    }
  }

  function deleteEntry(id) {
    sb.from('expenses').delete().eq('id', id).then(function (r) {
      if (r.error) showToast('Couldn’t delete. Check your connection and try again.');
      else { showToast('Entry deleted'); loadWeek(); }
    });
  }

  /* ---------- press and hold: entry options ---------- */
  var holdTimer = null, holdStart = null, suppressClick = false, holdHintShown = false, menuEntry = null, menuDelArmed = false;

  function attachHold(b, x) {
    function cancel() {
      clearTimeout(holdTimer);
      holdTimer = null;
      holdStart = null;
      b.classList.remove('pressing');
    }
    b.addEventListener('pointerdown', function (ev) {
      if (ev.button) return;
      holdStart = { x: ev.clientX, y: ev.clientY };
      b.classList.add('pressing');
      clearTimeout(holdTimer);
      holdTimer = setTimeout(function () {
        cancel();
        suppressClick = true;
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
        openMenu(x);
      }, 450);
    });
    b.addEventListener('pointermove', function (ev) {
      if (holdStart && Math.abs(ev.clientX - holdStart.x) + Math.abs(ev.clientY - holdStart.y) > 10) cancel();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { b.addEventListener(t, cancel); });
    b.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      cancel();
      if (!menuEntry) { suppressClick = true; openMenu(x); }
    });
    b.addEventListener('click', function (ev) {
      if (suppressClick) { suppressClick = false; return; }
      if (ev.detail === 0) { openMenu(x); return; } // keyboard
      if (!holdHintShown) { holdHintShown = true; showToast('Press and hold an entry for options'); }
    });
  }

  function weekStartOf(d) {
    var x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() - WEEK_STARTS_ON + 7) % 7));
    return x;
  }
  function envLabel(id) {
    var env = envById(id);
    return (id === 'unknown' || !env) ? 'Unsorted' : String(env.name);
  }

  function openMenu(x) {
    menuEntry = x;
    var d = new Date(x.spent_at);
    $('menu-title').textContent = fmt(x.amount) + ' EGP' + (x.note ? ' · ' + x.note : '');
    $('menu-sub').textContent = (x.spent_by === myId ? 'You' : (members[x.spent_by] || 'Someone')) +
      (isNaN(d) ? '' : ' · ' + d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
    $('menu-env-now').textContent = envLabel(x.envelope_id);
    $('menu-date-now').textContent = isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    menuPanel('main');
    $('menu').hidden = false;
    $('menu-main').querySelector('button').focus();
  }
  function closeMenu() {
    $('menu').hidden = true;
    menuEntry = null;
  }
  function menuPanel(name) {
    ['main', 'edit', 'env', 'date'].forEach(function (n) { $('menu-' + n).hidden = n !== name; });
    $('menu-cancel').textContent = name === 'main' ? 'Cancel' : 'Back';
    menuDelArmed = false;
    $('menu-del').textContent = 'Delete entry';
    $('edit-error').textContent = '';
    $('date-error').textContent = '';
  }

  async function updateEntry(patch, done) {
    var id = menuEntry.id;
    var r = await sb.from('expenses').update(patch).eq('id', id).select('id');
    if (r.error || !r.data || !r.data.length) { showToast('Couldn’t save the change. Try again.'); return false; }
    closeMenu();
    showToast(done);
    loadWeek();
    return true;
  }

  $('menu-main').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b || !menuEntry) return;
    var a = b.getAttribute('data-a');
    var x = menuEntry;
    if (a === 'edit') {
      menuPanel('edit');
      $('edit-amount').value = String(x.amount);
      $('edit-note').value = x.note || '';
      $('edit-amount').focus();
    } else if (a === 'env') {
      menuPanel('env');
      var list = $('menu-env');
      list.textContent = '';
      var ordered = envList.filter(function (e) { return e.id !== 'unknown'; });
      var unk = envById('unknown');
      if (unk) ordered.push(unk);
      ordered.forEach(function (e) {
        var on = e.id === x.envelope_id;
        var btn = el('button', on ? 'on' : null);
        btn.type = 'button';
        btn.appendChild(document.createTextNode(e.id === 'unknown' ? 'Unsorted' : String(e.name)));
        btn.appendChild(el('span', 'sub', on ? 'Current' : (e.name_ar ? String(e.name_ar) : '')));
        btn.addEventListener('click', function () {
          if (on) { closeMenu(); return; }
          updateEntry({ envelope_id: e.id }, 'Moved to ' + (e.id === 'unknown' ? 'Unsorted' : e.name));
        });
        list.appendChild(btn);
      });
      list.querySelector('button').focus();
    } else if (a === 'date') {
      menuPanel('date');
      var d = new Date(x.spent_at);
      $('edit-date').value = isNaN(d) ? dayKey(new Date()) : dayKey(d);
      $('edit-date').max = dayKey(new Date());
      $('edit-date').focus();
    } else if (a === 'del') {
      if (!menuDelArmed) { menuDelArmed = true; b.textContent = 'Tap again to delete'; return; }
      var id = x.id;
      closeMenu();
      deleteEntry(id);
    }
  });

  $('edit-save').addEventListener('click', function () {
    if (!menuEntry) return;
    var amt = evalExpr($('edit-amount').value);
    if (!(amt > 0)) { $('edit-error').textContent = 'Enter an amount, like 150 or 100+50.'; return; }
    updateEntry({ amount: amt, note: $('edit-note').value.trim().slice(0, 120) }, 'Entry updated');
  });
  $('edit-amount').addEventListener('input', function () { $('edit-error').textContent = ''; });

  $('date-save').addEventListener('click', function () {
    if (!menuEntry) return;
    var v = $('edit-date').value;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    if (!m) { $('date-error').textContent = 'Pick a date.'; return; }
    var old = new Date(menuEntry.spent_at);
    var nd = new Date(+m[1], +m[2] - 1, +m[3], isNaN(old) ? 12 : old.getHours(), isNaN(old) ? 0 : old.getMinutes());
    if (dayKey(nd) > dayKey(new Date())) { $('date-error').textContent = 'Pick today or an earlier date.'; return; }
    var ws = weekStartOf(nd);
    var moved = dayKey(ws) !== dayKey(startOfWeek(weekOffset));
    updateEntry({ spent_at: nd.toISOString(), week_start: dayKey(ws) },
      moved ? 'Moved to the week of ' + rangeLabel(ws) : 'Date changed');
  });

  $('menu-cancel').addEventListener('click', function () {
    if ($('menu-main').hidden) menuPanel('main'); else closeMenu();
  });
  $('menu').addEventListener('click', function (ev) { if (ev.target === $('menu')) closeMenu(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('menu').hidden) closeMenu(); });

  /* ---------- composer: text or number pad ---------- */
  function latinDigits(s) {
    return String(s)
      .replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
      .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); })
      .replace(/٫/g, '.').replace(/−/g, '-');
  }
  // Adds and subtracts numbers like "150+85-20". Returns NaN for anything else.
  function evalExpr(s) {
    s = latinDigits(s).replace(/\s+/g, '').replace(/[+\-]+$/, '');
    if (!s || !/^[0-9.+\-]+$/.test(s)) return NaN;
    var parts = s.match(/[+\-]?[^+\-]+/g);
    if (!parts) return NaN;
    var total = 0;
    for (var i = 0; i < parts.length; i++) {
      if (!/^[+\-]?(\d+\.?\d*|\.\d+)$/.test(parts[i])) return NaN;
      total += parseFloat(parts[i]);
    }
    return Math.round(total * 100) / 100;
  }
  function prettyExpr(s) { return s.replace(/-/g, ' − ').replace(/\+/g, ' + '); }

  function parseEntry() {
    var text = $('entry').value.trim();
    if (expr) return { amount: evalExpr(expr), note: text };
    var t = latinDigits(text);
    var m = t.match(/^([0-9.]+(?:\s*[+\-]\s*[0-9.]+)*)\s*(.*)$/);
    if (m) return { amount: evalExpr(m[1]), note: m[2].trim() };
    var m2 = t.match(/(^|\s)(\d+(?:\.\d+)?)(?=\s|$)/);
    if (m2) {
      var start = m2.index + m2[1].length;
      return { amount: parseFloat(m2[2]), note: (t.slice(0, start) + t.slice(start + m2[2].length)).replace(/\s+/g, ' ').trim() };
    }
    return { amount: NaN, note: text };
  }

  function updateComposer() {
    var hasOp = /[+\-]\d/.test(expr);
    var ex = $('expr');
    ex.hidden = !expr;
    if (expr) {
      var v = evalExpr(expr);
      ex.textContent = prettyExpr(expr) + (hasOp && !isNaN(v) ? ' = ' + fmt(v) : '');
    }
    var mb = $('modebtn');
    mb.textContent = '';
    mb.appendChild(icon(padOpen ? 'keyboard' : 'calc', 22));
    mb.setAttribute('aria-label', padOpen ? 'Show keyboard' : 'Show number pad');
    $('pad').hidden = !padOpen;
    $('entry').placeholder = expr ? 'What was it for?' : (padOpen ? 'Note (optional)' : '150 club entry');

    var p = parseEntry();
    var pv = $('preview');
    var any = expr || $('entry').value.trim();
    var ok = p.amount > 0;
    if (!any) pv.hidden = true;
    else {
      pv.hidden = false;
      pv.className = 'preview' + (ok ? '' : ' bad');
      pv.textContent = ok ? 'Saves ' + fmt(p.amount) + ' EGP' + (p.note ? ' · ' + p.note : '') : 'Add an amount: type it first, or use the number pad';
    }
    $('sendbtn').disabled = sending || !ok;
  }

  function pressPad(k) {
    if (k === 'abc') { padOpen = false; updateComposer(); $('entry').focus(); return; }
    var last = expr.slice(-1);
    var seg = expr.split(/[+\-]/).pop();
    if (k === 'del') expr = expr.slice(0, -1);
    else if (k === '+' || k === '-') {
      if (!expr) return;
      expr = (last === '+' || last === '-') ? expr.slice(0, -1) + k : expr + k;
    } else if (k === '.') {
      if (seg.indexOf('.') !== -1) return;
      expr += seg === '' ? '0.' : '.';
    } else {
      if (expr.length >= 30) return;
      var di = seg.indexOf('.');
      if (di !== -1 && seg.length - di > 2) return;
      if (k === '00' && (seg === '' || seg === '0')) return;
      expr = seg === '0' ? expr.slice(0, -1) + k : expr + k;
    }
    updateComposer();
  }

  function openPad() {
    padOpen = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    updateComposer();
  }

  async function sendEntry() {
    var p = parseEntry();
    if (!(p.amount > 0) || sending) { if (!(p.amount > 0)) showToast('Add an amount first'); return; }
    sending = true;
    updateComposer();
    var r = await sb.from('expenses').insert({
      envelope_id: 'unknown',
      amount: p.amount,
      note: p.note.slice(0, 120),
      week_start: dayKey(startOfWeek(weekOffset))
    });
    sending = false;
    if (r.error) { updateComposer(); showToast('Couldn’t save. Check your connection and try again.'); return; }
    expr = '';
    $('entry').value = '';
    updateComposer();
    showToast('Saved ' + fmt(p.amount) + ' EGP');
    scrollToEnd = true;
    loadWeek();
  }

  function renderGrid() {
    var grid = $('grid');
    grid.textContent = '';
    var totalBudget = 0, totalSpent = 0;
    if (!weekLoaded) {
      grid.appendChild(el('div', 'empty', 'Loading your envelopes…'));
    } else if (!envList.length) {
      grid.appendChild(el('div', 'empty', 'No envelopes yet. Run the database setup in Supabase to add them.'));
    } else {
      envList.forEach(function (env) {
        var budget = Number(env.weekly) || 0;
        var spent = spentFor(env.id);
        var left = budget - spent;
        totalBudget += budget;
        totalSpent += spent;

        var open = budget <= 0; // no set limit, e.g. Unknown
        var b = el('button', 'card' + (WIDE[env.id] ? ' wide' : ''));
        b.type = 'button';
        b.setAttribute('aria-label', env.name + ': ' + (open ? fmt(spent) + ' EGP spent, no set budget' : signed(left) + ' EGP left of ' + fmt(budget)) + '. Add spending');
        var head = el('span', 'head');
        var ic = el('span', 'icon');
        ic.appendChild(icon(String(env.icon || env.id)));
        head.appendChild(ic);
        var names = el('span', 'names');
        names.appendChild(el('b', null, String(env.name)));
        if (env.name_ar) names.appendChild(el('span', null, String(env.name_ar)));
        head.appendChild(names);
        b.appendChild(head);

        var amt = el('span', 'amt');
        if (open) {
          amt.appendChild(el('b', null, fmt(spent)));
          amt.appendChild(el('span', null, 'spent · no set budget'));
        } else {
          amt.appendChild(el('b', left < 0 ? 'over' : null, signed(left)));
          amt.appendChild(el('span', null, 'left of ' + fmt(budget)));
        }
        b.appendChild(amt);

        if (!open) {
          var bar = el('span', 'bar' + (left < budget * 0.2 ? ' warn' : ''));
          var fill = el('span');
          fill.style.width = Math.min(100, Math.max(0, spent / budget * 100)).toFixed(1) + '%';
          bar.appendChild(fill);
          b.appendChild(bar);
        }

        var latest = null;
        expenses.forEach(function (x) { if (x.envelope_id === env.id && !latest) latest = x; }); // expenses are newest first
        b.appendChild(el('span', 'last', latest ? 'Last: ' + (latest.note || fmt(latest.amount) + ' EGP') : 'Nothing spent yet'));

        b.addEventListener('click', function () { openSheet(env.id, b); });
        grid.appendChild(b);
      });
    }
    var totalLeft = totalBudget - totalSpent;
    var tl = $('total-left');
    tl.textContent = signed(totalLeft);
    tl.className = totalLeft < 0 ? 'over' : '';
    $('total-sub').textContent = weekLoaded ? 'Spent ' + fmt(totalSpent) + ' of ' + fmt(totalBudget) + (weekOffset === 0 ? ' this week' : ' that week') : 'Loading…';
    var tb = $('total-bar');
    tb.className = 'bar thick' + (totalBudget > 0 && totalLeft < totalBudget * 0.2 ? ' warn' : '');
    tb.firstElementChild.style.width = (totalBudget > 0 ? Math.min(100, Math.max(0, totalSpent / totalBudget * 100)) : 0).toFixed(1) + '%';
  }

  function renderEntries() {
    var box = $('entries');
    box.textContent = '';
    if (!weekLoaded) { box.appendChild(el('div', 'none', 'Loading…')); return; }
    if (!expenses.length) { box.appendChild(el('div', 'none', 'Nothing added yet. Tap an envelope to add what you spent.')); return; }
    expenses.forEach(function (x) {
      var env = envById(x.envelope_id);
      var envName = env ? String(env.name) : String(x.envelope_id);
      var who = x.spent_by === myId ? 'You' : (members[x.spent_by] || 'Someone');
      var d = new Date(x.spent_at);
      var when = isNaN(d) ? '' : d.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      var row = el('div', 'entry');
      var main = el('div', 'main');
      main.appendChild(el('b', null, x.note || envName));
      main.appendChild(el('span', null, envName + ' · ' + who + (when ? ' · ' + when : '')));
      row.appendChild(main);
      row.appendChild(el('span', 'value', fmt(x.amount)));

      var del = el('button', 'delbtn' + (pendingDelete === x.id ? ' confirm' : ''));
      del.type = 'button';
      if (pendingDelete === x.id) {
        del.textContent = 'Delete?';
        del.setAttribute('aria-label', 'Tap again to delete this entry');
      } else {
        del.appendChild(icon('trash', 18));
        del.setAttribute('aria-label', 'Delete entry');
      }
      del.addEventListener('click', function () { onDelete(x.id); });
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  /* ---------- data ---------- */
  async function loadHousehold() {
    var res = await Promise.all([
      sb.from('members').select('user_id, display_name'),
      sb.from('envelopes').select('id, name, name_ar, weekly, icon, sort').order('sort')
    ]);
    if (res[0].error || res[1].error) throw (res[0].error || res[1].error);
    members = {};
    res[0].data.forEach(function (m) { members[m.user_id] = String(m.display_name || ''); });
    envList = res[1].data || [];
    return !!members[myId];
  }

  async function loadWeek() {
    var req = ++weekReq;
    var wk = dayKey(startOfWeek(weekOffset));
    var r = await sb.from('expenses')
      .select('id, envelope_id, amount, note, spent_by, spent_at')
      .eq('week_start', wk)
      .order('spent_at', { ascending: false });
    if (req !== weekReq) return; // a newer load started
    if (r.error) { showToast('Couldn’t load spending. Check your connection.'); return; }
    expenses = (r.data || []).map(function (x) {
      return { id: x.id, envelope_id: String(x.envelope_id), amount: Number(x.amount) || 0, note: x.note ? String(x.note) : '', spent_by: x.spent_by, spent_at: x.spent_at };
    });
    weekLoaded = true;
    render();
    if (sel) updateSheet();
  }

  function changeWeek(delta) {
    weekOffset += delta;
    if (weekOffset > 0) weekOffset = 0;
    weekLoaded = false;
    pendingDelete = null;
    render();
    loadWeek();
  }

  function subscribeLive() {
    if (channel) return;
    channel = sb.channel('expenses-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, function () { loadWeek(); })
      .subscribe();
  }

  async function onSession(session) {
    var uid = session && session.user ? session.user.id : null;
    if (uid === loadedFor && uid) return;
    loadedFor = uid;
    myId = uid;
    if (!uid) {
      if (channel) { sb.removeChannel(channel); channel = null; }
      showView('signin');
      return;
    }
    notice('Loading…', false);
    try {
      var ok = await loadHousehold();
      if (!ok) { notice('This account isn’t part of the household yet. Ask Mohamed to add it in Supabase.', true); return; }
    } catch (e) {
      notice('Couldn’t reach the database. Check your connection and reopen the app.', true);
      return;
    }
    $('signed-as').textContent = 'Signed in as ' + (members[myId] || session.user.email || 'you');
    showView('chat');
    weekLoaded = false;
    render();
    loadWeek();
    subscribeLive();
  }

  /* ---------- delete ---------- */
  function onDelete(id) {
    if (pendingDelete !== id) {
      pendingDelete = id;
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(function () { pendingDelete = null; renderEntries(); }, 4000);
      renderEntries();
      return;
    }
    pendingDelete = null;
    clearTimeout(pendingTimer);
    renderEntries();
    sb.from('expenses').delete().eq('id', id).then(function (r) {
      if (r.error) showToast('Couldn’t delete. Check your connection and try again.');
      else { showToast('Entry deleted'); loadWeek(); }
    });
  }

  /* ---------- note suggestions ---------- */
  async function loadNotes(envId) {
    var req = ++notesReq;
    var res = await Promise.all([
      sb.from('pinned_notes').select('id, note').eq('envelope_id', envId).order('created_at'),
      sb.from('expenses').select('note').eq('envelope_id', envId).neq('note', '').order('spent_at', { ascending: false }).limit(80)
    ]);
    if (req !== notesReq || sel !== envId) return;
    notePins = res[0].error ? [] : (res[0].data || []).map(function (p) { return { id: p.id, note: String(p.note) }; });
    var pinned = {};
    notePins.forEach(function (p) { pinned[p.note] = true; });
    var seen = {};
    noteRecent = [];
    (res[1].error ? [] : res[1].data || []).forEach(function (r) {
      var n = String(r.note || '').trim();
      if (!n || seen[n] || pinned[n] || noteRecent.length >= 8) return;
      seen[n] = true;
      noteRecent.push(n);
    });
    renderNoteChips();
  }

  function noteChip(text, pin) {
    var current = $('note').value.trim();
    var chip = el('div', 'chip' + (current === text ? ' selected' : ''));
    var pick = el('button', 'chip-text', text);
    pick.type = 'button';
    pick.setAttribute('aria-pressed', current === text ? 'true' : 'false');
    pick.addEventListener('click', function () {
      $('note').value = text;
      renderNoteChips();
    });
    chip.appendChild(pick);
    var tog = el('button', 'chip-pin' + (pin ? ' on' : ''));
    tog.type = 'button';
    tog.setAttribute('aria-label', (pin ? 'Unpin ' : 'Pin ') + text);
    var ic = icon('pin', 18);
    if (pin) ic.setAttribute('fill', 'currentColor');
    tog.appendChild(ic);
    tog.addEventListener('click', function () { togglePin(text, pin); });
    chip.appendChild(tog);
    return chip;
  }

  function renderNoteChips() {
    var box = $('note-suggest');
    box.textContent = '';
    box.hidden = false;
    if (!notePins.length && !noteRecent.length) {
      box.appendChild(el('span', 'suggest-hint', 'Notes you use in this envelope will show here. Tap one to reuse it, or pin it to keep it at the top.'));
      return;
    }
    if (notePins.length) {
      box.appendChild(el('span', 'suggest-label', 'Pinned'));
      var row = el('div', 'chips');
      notePins.forEach(function (p) { row.appendChild(noteChip(p.note, p)); });
      box.appendChild(row);
    }
    if (noteRecent.length) {
      box.appendChild(el('span', 'suggest-label', 'Recent'));
      var row2 = el('div', 'chips');
      noteRecent.forEach(function (n) { row2.appendChild(noteChip(n, null)); });
      box.appendChild(row2);
    }
  }

  async function togglePin(text, pin) {
    if (pinBusy || !sel) return;
    pinBusy = true;
    var envId = sel;
    var r = pin
      ? await sb.from('pinned_notes').delete().eq('id', pin.id)
      : await sb.from('pinned_notes').insert({ envelope_id: envId, note: text });
    pinBusy = false;
    if (r.error && r.error.code !== '23505') showToast(pin ? 'Couldn’t unpin. Try again.' : 'Couldn’t pin. Try again.');
    else showToast(pin ? 'Unpinned' : 'Pinned');
    if (sel === envId) loadNotes(envId);
  }

  /* ---------- add sheet ---------- */
  function openSheet(id, from) {
    sel = id;
    amount = '';
    $('note').value = '';
    notePins = [];
    noteRecent = [];
    $('note-suggest').hidden = true; // stays hidden until notes load, so the hint doesn't flash
    loadNotes(id);
    returnFocus = from || null;
    updateSheet();
    $('sheet').hidden = false;
    document.body.style.overflow = 'hidden';
    $('cancel').focus();
  }
  function closeSheet() {
    $('sheet').hidden = true;
    document.body.style.overflow = '';
    sel = null;
    if (returnFocus && document.body.contains(returnFocus)) returnFocus.focus();
  }
  function updateSheet() {
    var env = envById(sel);
    if (!env) return;
    var budget = Number(env.weekly) || 0;
    var open = budget <= 0;
    var left = budget - spentFor(env.id);
    var n = parseFloat(amount) || 0;
    var after = left - n;
    var when = weekOffset === 0 ? 'this week' : 'in the week of ' + rangeLabel(startOfWeek(weekOffset));
    $('sheet-name').textContent = String(env.name);
    $('sheet-ar').textContent = env.name_ar ? String(env.name_ar) : '';
    $('sheet-ctx').textContent = open ? fmt(spentFor(env.id)) + ' EGP spent ' + when + ' · no set budget' : signed(left) + ' EGP left ' + when;
    var a = $('amount');
    a.textContent = amount === '' ? '0' : amount;
    a.className = amount === '' ? 'placeholder' : '';
    var af = $('after');
    if (open) { af.textContent = n > 0 ? 'You can move it to the right envelope later' : ''; af.className = 'after'; }
    else if (n > 0 && after < 0) { af.textContent = 'Over this envelope by ' + fmt(-after) + ' EGP'; af.className = 'after over'; }
    else { af.textContent = n > 0 ? 'Leaves ' + fmt(after) + ' EGP' : ''; af.className = 'after'; }
    var s = $('save');
    s.textContent = saving ? 'Saving…' : 'Save to ' + String(env.name);
    s.disabled = saving || !(n > 0);
  }
  function press(k) {
    var a = amount;
    if (k === 'del') a = a.slice(0, -1);
    else if (k === '.') {
      if (a.indexOf('.') !== -1) return;
      a = a === '' ? '0.' : a + '.';
    } else {
      var dot = a.indexOf('.');
      if (dot !== -1 && a.length - dot > 2) return;
      if (a.replace('.', '').length >= 7) return;
      a = a === '0' ? k : a + k;
    }
    amount = a;
    updateSheet();
  }
  async function save() {
    var n = parseFloat(amount);
    if (!(n > 0) || saving || !sel) return;
    var env = envById(sel);
    saving = true;
    updateSheet();
    var row = {
      envelope_id: sel,
      amount: Math.round(n * 100) / 100,
      note: $('note').value.trim().slice(0, 120),
      week_start: dayKey(startOfWeek(weekOffset))
    };
    var r = await sb.from('expenses').insert(row);
    saving = false;
    if (r.error) {
      updateSheet();
      showToast('Couldn’t save. Check your connection and try again.');
      return;
    }
    closeSheet();
    showToast('Saved ' + fmt(row.amount) + ' EGP to ' + (env ? env.name : 'envelope'));
    loadWeek();
  }

  /* ---------- events ---------- */
  $('keys').addEventListener('click', function (ev) {
    var b = ev.target.closest('.key');
    if (b) press(b.getAttribute('data-k'));
  });
  $('cancel').addEventListener('click', closeSheet);
  $('note').addEventListener('input', function () { if (notePins.length || noteRecent.length) renderNoteChips(); });  $('save').addEventListener('click', save);
  $('sheet').addEventListener('keydown', function (ev) {
    if (ev.target === $('note')) {
      if (ev.key === 'Enter') { ev.preventDefault(); save(); }
      return;
    }
    if (/^[0-9]$/.test(ev.key)) { press(ev.key); ev.preventDefault(); }
    else if (ev.key === '.') { press('.'); ev.preventDefault(); }
    else if (ev.key === 'Backspace') { press('del'); ev.preventDefault(); }
    else if (ev.key === 'Escape') { closeSheet(); }
  });
  $('prev-week').addEventListener('click', function () { changeWeek(-1); });
  $('next-week').addEventListener('click', function () { changeWeek(1); });
  $('signout').addEventListener('click', function () { sb.auth.signOut(); });
  $('notice-signout').addEventListener('click', function () { sb.auth.signOut(); });

  $('signin').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var email = $('email').value.trim();
    var password = $('password').value;
    var err = $('signin-error');
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    err.textContent = '';
    $('signin-btn').disabled = true;
    $('signin-btn').textContent = 'Signing in…';
    var r = await sb.auth.signInWithPassword({ email: email, password: password });
    $('signin-btn').disabled = false;
    $('signin-btn').textContent = 'Sign in';
    if (r.error) err.textContent = r.error.status === 400 ? 'Wrong email or password.' : 'Couldn’t sign in. Check your connection and try again.';
    else $('password').value = '';
  });

  // iPhone pauses the live connection in the background, so refresh when the app comes back.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && myId && (!$('main').hidden || !$('chat').hidden)) loadWeek();
  });

  /* ---------- updates: phones keep an old copy, so check for a newer one ---------- */
  $('app-version').textContent = '· Version ' + APP_VERSION;
  async function checkForUpdate() {
    try {
      var r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      var j = await r.json();
      if (j && j.version && String(j.version) !== APP_VERSION) $('update').hidden = false;
    } catch (e) { /* offline: try again next time */ }
  }
  $('update-btn').addEventListener('click', async function () {
    $('update-btn').textContent = 'Updating…';
    try {
      await Promise.all([
        fetch(location.pathname, { cache: 'reload' }),
        fetch('config.js', { cache: 'reload' })
      ]);
    } catch (e) {}
    location.reload();
  });
  checkForUpdate();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkForUpdate();
  });

  /* ---------- chat wiring ---------- */
  $('sendbtn').appendChild(icon('send', 22));
  $('pad').querySelector('[data-p="del"]').appendChild(icon('back', 24));
  $('pad').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (b) pressPad(b.getAttribute('data-p'));
  });
  $('modebtn').addEventListener('click', function () {
    if (padOpen) { padOpen = false; updateComposer(); $('entry').focus(); }
    else openPad();
  });
  $('expr').addEventListener('click', openPad);
  $('entry').addEventListener('focus', function () { if (padOpen) { padOpen = false; updateComposer(); } });
  $('entry').addEventListener('input', updateComposer);
  $('entry').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); sendEntry(); } });
  $('sendbtn').addEventListener('click', sendEntry);
  $('chat-prev').addEventListener('click', function () { scrollToEnd = true; changeWeek(-1); });
  $('chat-next').addEventListener('click', function () { scrollToEnd = true; changeWeek(1); });
  $('to-envelopes').addEventListener('click', function () { showView('main'); });
  $('to-chat').addEventListener('click', function () { showView('chat'); });
  updateComposer();

  // Keep the list clear of the composer, and keep the composer above the iPhone keyboard.
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      document.documentElement.style.setProperty('--composer-h', ($('composer').offsetHeight + 16) + 'px');
    }).observe($('composer'));
  }
  if (window.visualViewport) {
    var vv = window.visualViewport;
    var lift = function () {
      var off = window.innerHeight - vv.height - vv.offsetTop;
      $('composer').style.transform = off > 1 ? 'translateY(' + (-off) + 'px)' : '';
    };
    vv.addEventListener('resize', lift);
    vv.addEventListener('scroll', lift);
  }

  /* ---------- start ---------- */
  var cfg = window.FE_CONFIG || {};
  if (!window.supabase || !cfg.url || cfg.url.indexOf('YOUR-') !== -1 || !cfg.anonKey || cfg.anonKey.indexOf('YOUR-') !== -1) {
    notice(window.supabase ? 'Almost ready: add your Supabase project URL and key to config.js.' : 'Couldn’t load the app. Check your connection and reload.', false);
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.getSession().then(function (r) { onSession(r.data.session); });
  sb.auth.onAuthStateChange(function (_event, session) { setTimeout(function () { onSession(session); }, 0); });
})();
</script>
</body>
